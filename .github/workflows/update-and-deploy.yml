name: Update leaderboard and deploy 
 
on: 
  schedule: 
    - cron: '0 11 * * *' 
  workflow_dispatch: 
  push:
    paths:
      - '.github/workflows/update-and-deploy.yml'
 
permissions: 
  contents: read 
  pages: write 
  id-token: write 
 
concurrency: 
  group: pages 
  cancel-in-progress: true 
 
jobs: 
  build-and-deploy: 
    runs-on: ubuntu-latest 
 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
 
    steps: 
      - name: Checkout 
        uses: actions/checkout@v6 
 
      - name: Configure Git 
        run: | 
          git config --global user.name "RusdiEneri" 
          git config --global user.email "nuruddinrusydiilham@gmail.com" 
 
      - name: Setup Node 
        uses: actions/setup-node@v6 
        with: 
          node-version: 24 
 
      - name: Calculate 1 year ago date
        id: date_calc
        run: echo "streak_from=$(date -u -d '1 year ago' +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Generate leaderboard data 
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          MAX_CANDIDATES: 100          # Dikurangi jadi 100 (sudah cukup untuk top leaderboard)
          SEARCH_PER_LOCATION: 20      # Dikurangi dari 100. (32 lokasi * 20 = 640 kandidat, lebih dari cukup)
          SEARCH_DELAY_MS: 5000        # SANGAT PENTING: Naikkan jadi 5 detik (aman di bawah batas 30 req/menit)
          GRAPHQL_BATCH_SIZE: 1        # Turunkan jadi 1 per request agar sangat ringan
          GRAPHQL_DELAY_MS: 3000       # Naikkan jadi 3 detik antar request kalender
          STREAK_FROM: ${{ steps.date_calc.outputs.streak_from }}
        run: node scripts/update.js 
 
      - name: Configure Pages 
        uses: actions/configure-pages@v5 
 
      - name: Upload Pages artifact 
        uses: actions/upload-pages-artifact@v4 
        with: 
          path: ./public 
 
      - name: Deploy to GitHub Pages 
        id: deployment 
        uses: actions/deploy-pages@v4
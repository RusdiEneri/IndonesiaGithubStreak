name: Update leaderboard and deploy

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate leaderboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CANDIDATES: 250
          SEARCH_PER_LOCATION: 100
          SEARCH_DELAY_MS: 2200
          GRAPHQL_BATCH_SIZE: 8
          STREAK_FROM: '2008-01-01T00:00:00Z'
        run: node scripts/update.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

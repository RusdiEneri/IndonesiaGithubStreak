name: Update leaderboard and deploy 
 
on: 
  schedule: 
    - cron: '0 11 * * *' 
  workflow_dispatch: 
  push:
    paths:
      - '.github/workflows/update-and-deploy.yml'
 
permissions: 
  contents: read 
  pages: write 
  id-token: write 
 
concurrency: 
  group: pages 
  cancel-in-progress: true 
 
jobs: 
  build-and-deploy: 
    runs-on: ubuntu-latest 
 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
 
    steps: 
      - name: Checkout 
        uses: actions/checkout@v6 
 
      - name: Configure Git 
        run: | 
          git config --global user.name "RusdiEneri" 
          git config --global user.email "nuruddinrusydiilham@gmail.com" 
 
      - name: Setup Node 
        uses: actions/setup-node@v6 
        with: 
          node-version: 24 
 
      # TAMBAHAN: Menghitung tanggal tepat 1 tahun yang lalu
      - name: Calculate 1 year ago date
        id: date_calc
        run: echo "streak_from=$(date -u -d '1 year ago' +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Generate leaderboard data 
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          MAX_CANDIDATES: 150          # Dikurangi dari 250 agar total request lebih aman
          SEARCH_PER_LOCATION: 100 
          SEARCH_DELAY_MS: 2200 
          GRAPHQL_BATCH_SIZE: 2        # SANGAT PENTING: Turunkan dari 8 menjadi 2 (atau 1)
          GRAPHQL_DELAY_MS: 2000       # Tambahkan jeda 2 detik antar request GraphQL
          STREAK_FROM: ${{ steps.date_calc.outputs.streak_from }}
        run: node scripts/update.js 
 
      - name: Configure Pages 
        uses: actions/configure-pages@v5 
 
      - name: Upload Pages artifact 
        uses: actions/upload-pages-artifact@v4 
        with: 
          path: ./public 
 
      - name: Deploy to GitHub Pages 
        id: deployment 
        uses: actions/deploy-pages@v4
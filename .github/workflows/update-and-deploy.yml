name: Update leaderboard and deploy 
 
on: 
  schedule: 
    - cron: '0 11 * * *' 
  workflow_dispatch: 
  push:
    paths:
      - '.github/workflows/update-and-deploy.yml'
      - 'scripts/**'
 
permissions: 
  contents: read 
  pages: write 
  id-token: write 
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
 
jobs: 
  build-and-deploy: 
    runs-on: ubuntu-latest 
 
    environment: 
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }} 
 
    steps: 
      - name: Checkout 
        uses: actions/checkout@v6 
 
      - name: Configure Git 
        run: | 
          git config --global user.name "RusdiEneri" 
          git config --global user.email "nuruddinrusydiilham@gmail.com" 
 
      - name: Setup Node 
        uses: actions/setup-node@v6 
        with: 
          node-version: 24 
 
      - name: Calculate 1 year ago date
        id: date_calc
        run: echo "streak_from=$(date -u -d '1 year ago' +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Generate leaderboard data 
        env: 
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }} 
          MAX_CANDIDATES: 100          # Cukup untuk top leaderboard
          SEARCH_PER_LOCATION: 50      # 50 per lokasi agar cukup 2-3 query search saja
          SEARCH_DELAY_MS: 10000       # 10 detik antar search query agar aman dari rate limit
          GRAPHQL_BATCH_SIZE: 1        # 1 user per request agar sangat ringan
          GRAPHQL_DELAY_MS: 3000       # 3 detik antar request kalender GraphQL
          STREAK_FROM: ${{ steps.date_calc.outputs.streak_from }}
        run: node scripts/update.js 
 
      - name: Configure Pages 
        uses: actions/configure-pages@v6 
 
      - name: Upload Pages artifact 
        uses: actions/upload-pages-artifact@v5 
        with: 
          path: ./public 
 
      - name: Deploy to GitHub Pages 
        id: deployment 
        uses: actions/deploy-pages@v5